# Builds the iOS app on a macOS runner, because Xcode is the only toolchain
# that can compile and sign one and it does not run on Windows.
#
# The unsigned job needs nothing set up: it proves the iOS target compiles and
# every plugin resolves. It cannot produce something installable — an iOS
# binary without a signature will not launch on a device.
#
# The signed job is commented out and needs a paid Apple Developer account
# plus four repository secrets. See supabase/../README.md, "Running on iOS".

name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches the revision in .metadata; bump both together so CI and
          # local builds cannot diverge.
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # --no-codesign is what makes this runnable without an Apple account.
      # It produces Runner.app, which is enough to prove the build is sound
      # and is what the simulator uses, but it will not install on a phone.
      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

