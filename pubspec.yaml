name: smart_iq
description: "Smart IQ — General Knowledge & IQ exam preparation for Sri Lanka."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Models

  # Networking / backend
  dio: ^5.7.0
  supabase_flutter: ^2.8.1

  # Local storage
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  cached_network_image: ^3.4.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil.ttf
