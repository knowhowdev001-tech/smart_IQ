name: smart_iq
description: "Smart IQ — General Knowledge & IQ exam preparation for Sri Lanka."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Models

  # Networking / backend
  dio: ^5.7.0
  supabase_flutter: ^2.8.1

  # Local storage
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  cached_network_image: ^3.4.1
  intl: any

  # Push notifications (PRD 6.8)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate with: dart run flutter_launcher_icons
#
# `app_icon.png` is derived from `app_logo.png` — squared, zoomed past the
# logo's own rounded corners so it bleeds to the edge, and flattened to remove
# the alpha channel that iOS icons may not carry.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  # The adaptive foreground uses the same cleaned source, not app_logo.png:
  # the raw logo keeps white arcs at its rounded corners, which show as white
  # slivers once the launcher masks it over the blue background. app_icon.png
  # already shares this background colour, so the inset blends into it.
  adaptive_icon_background: "#17345E"
  adaptive_icon_foreground: assets/images/app_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil.ttf
