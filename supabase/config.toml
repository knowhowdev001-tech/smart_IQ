project_id = "glmryghkrpnmlqymsxuz"

# The two OTP endpoints are the app's front door, so they cannot require a
# token: a user requesting a code has no session yet, by definition. They are
# public in the same way GoTrue's own token endpoint is, and are rate limited
# on the MSISDN (cooldown) and on wrong guesses (attempt_count) instead.
[functions.otp-request]
verify_jwt = false

[functions.otp-verify]
verify_jwt = false

# The caller's access token has expired by definition, so there is nothing to
# verify. The refresh token in the body is the credential, and it is checked
# against the hash in auth_sessions.
[functions.auth-refresh]
verify_jwt = false

# Called by pg_cron through pg_net, never by the app. It checks the
# `x-dispatch-secret` header against PUSH_DISPATCH_SECRET instead of a JWT.
[functions.push-dispatch]
verify_jwt = false

# Called by the signed-in app, so it does require a token - but it checks
# our HS256 access token itself (verifyAccessToken), because the gateway's
# own JWT check follows the project's signing-key setup rather than the
# secret otp-verify mints with.
[functions.payment-status]
verify_jwt = false

# The AI tutor proxy (PRD 4.5). Same token handling as payment-status: our
# own HS256 access token, checked inside the function.
[functions.ai-chat]
verify_jwt = false
